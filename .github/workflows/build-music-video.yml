name: Build music-video branch

on:
  push:
    branches:
      - feature/music-video-player
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          test -f "$HOME/.android/debug.keystore"

      - name: Build FOSS universal debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleUniversalFossDebug --stacktrace --no-daemon
