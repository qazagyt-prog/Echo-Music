name: Build music-video branch

on:
  push:
    branches:
      - feature/music-video-player

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build FOSS universal debug APK
        run: ./gradlew assembleUniversalFossDebug --stacktrace
