name: Build music-video branch

on:
  push:
    branches:
      - feature/music-video-player
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build FOSS universal debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleUniversalFossDebug --stacktrace
