name: Build Music Player V5 APK
on:
  workflow_dispatch:
  push:
    branches: [music-player-v5-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack Music Player V5
        run: |
          rm -rf /tmp/music-player-v5
          mkdir -p /tmp/music-player-v5
          unzip -q music-player-v5/MusicPlayerV5.zip -d /tmp/music-player-v5
      - name: Build debug APK
        working-directory: /tmp/music-player-v5/MusicPlayerV4/MusicPlayerV4
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerV5-debug-apk
          path: /tmp/music-player-v5/MusicPlayerV4/MusicPlayerV4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
